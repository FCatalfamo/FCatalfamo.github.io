<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build places.json</title>

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <style>
        body {
            font-family: Inter, Arial, sans-serif;
            margin: 40px auto;
            width: min(900px, 92%);
            line-height: 1.6;
            color: #202522;
        }

        h1 {
            margin-bottom: 10px;
        }

        .box {
            border: 1px solid #d7d7d7;
            padding: 20px;
            margin-top: 20px;
        }

        button {
            background: #104945;
            color: white;
            border: 0;
            padding: 12px 18px;
            cursor: pointer;
            font-size: 14px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #log {
            white-space: pre-wrap;
            font-family: ui-monospace, monospace;
            font-size: 13px;
            background: #fafafa;
            border: 1px solid #e0e0e0;
            padding: 16px;
            min-height: 180px;
            margin-top: 16px;
        }
    </style>
</head>
<body>

    <h1>Build places.json</h1>

    <p>
        Carica il file <strong>Visited.csv</strong>, poi clicca il bottone.
        Il file verrà geocodificato e scaricherai <strong>places.json</strong>.
    </p>

    <div class="box">
        <input type="file" id="csvFile" accept=".csv">
        <button id="startBtn">Convert CSV to places.json</button>
        <div id="log">Waiting for file...</div>
    </div>

    <script>
        const csvFileInput = document.getElementById("csvFile");
        const startBtn = document.getElementById("startBtn");
        const logEl = document.getElementById("log");

        function log(message) {
            logEl.textContent += "\n" + message;
            logEl.scrollTop = logEl.scrollHeight;
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function geocodePlace(name) {
            const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=${encodeURIComponent(name)}`;

            const response = await fetch(url, {
                headers: {
                    "Accept": "application/json"
                }
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const results = await response.json();

            if (!results.length) {
                return null;
            }

            return results[0];
        }

        startBtn.addEventListener("click", async () => {

            const file = csvFileInput.files[0];

            if (!file) {
                alert("Carica prima il file Visited.csv");
                return;
            }

            startBtn.disabled = true;
            logEl.textContent = "Parsing CSV...";

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: async function(results) {

                    const rows = results.data
                        .filter(row => row.Titolo && row.Titolo.trim() !== "")
                        .map(row => ({
                            name: row.Titolo.trim(),
                            url: (row.URL || "").trim()
                        }));

                    log(`Found ${rows.length} places.`);
                    log("Starting geocoding...");
                    log("This may take a while.");

                    const output = [];

                    for (let i = 0; i < rows.length; i++) {

                        const row = rows[i];

                        log(`[${i + 1}/${rows.length}] ${row.name}`);

                        try {

                            const result = await geocodePlace(row.name);

                            if (result) {

                                output.push({
                                    name: row.name,
                                    lat: parseFloat(result.lat),
                                    lng: parseFloat(result.lon),
                                    url: row.url,
                                    matched_name: result.display_name
                                });

                                log(`  -> matched: ${result.display_name}`);

                            } else {

                                output.push({
                                    name: row.name,
                                    lat: null,
                                    lng: null,
                                    url: row.url,
                                    matched_name: null
                                });

                                log("  -> no match found");
                            }

                        } catch (error) {

                            output.push({
                                name: row.name,
                                lat: null,
                                lng: null,
                                url: row.url,
                                matched_name: null
                            });

                            log(`  -> error: ${error.message}`);
                        }

                        await sleep(1100);
                    }

                    const blob = new Blob(
                        [JSON.stringify(output, null, 2)],
                        { type: "application/json" }
                    );

                    const downloadUrl = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = downloadUrl;
                    a.download = "places.json";
                    a.click();
                    URL.revokeObjectURL(downloadUrl);

                    log("");
                    log("Done. places.json downloaded.");
                    log("Now move it into /assets/data/places.json");

                    startBtn.disabled = false;
                }
            });
        });
    </script>

</body>
</html>
